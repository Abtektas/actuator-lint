[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "actuator-lint"
dynamic = ["version"]
description = "Offline review aid for PX4 control allocation parameters"
# the README has links inside the repository, which the package index does not resolve
readme = "docs/pypi.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "the actuator-lint contributors" }]
keywords = ["px4", "control allocation", "uav", "drone", "vtol", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Abtektas/actuator-lint"
Documentation = "https://github.com/Abtektas/actuator-lint/blob/main/docs/getting-started.md"
Changelog = "https://github.com/Abtektas/actuator-lint/blob/main/CHANGELOG.md"
Issues = "https://github.com/Abtektas/actuator-lint/issues"

[project.scripts]
actuator-lint = "actuator_lint.cli:main"

[tool.hatch.version]
path = "actuator_lint/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["actuator_lint"]
