<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Body axes and motor numbers of the quadrotor in examples/quad_qgc_export.params</title>
  <desc id="desc">Top view. The x axis points forwards, the y axis to the right, the z axis down. motor0 is front right and motor1 rear left, both turn counter-clockwise. motor2 is front left and motor3 rear right, both turn clockwise.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="spin" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="760" height="480" fill="#ffffff"/>
  <g stroke="#9e9e9e" stroke-width="6" stroke-linecap="round">
    <line x1="380" y1="230" x2="485" y2="125"/>
    <line x1="380" y1="230" x2="275" y2="335"/>
    <line x1="380" y1="230" x2="275" y2="125"/>
    <line x1="380" y1="230" x2="485" y2="335"/>
  </g>
  <g stroke="#1a1a1a" stroke-width="2.5" fill="none">
    <line x1="380" y1="230" x2="380" y2="52" marker-end="url(#head)"/>
    <line x1="380" y1="230" x2="440" y2="230"/>
  </g>
  <circle cx="380" cy="230" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M374,224 L386,236 M386,224 L374,236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="389" y1="230" x2="442" y2="230" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#head)"/>
  <g font-size="15" fill="#1a1a1a">
    <text x="380" y="40" text-anchor="middle">x: forwards</text>
    <text x="452" y="235">y: to the right</text>
    <text x="354" y="235" text-anchor="end">z: down, into the page</text>
  </g>
  <circle cx="485" cy="125" r="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <path d="M485,173 A48,48 0 1 0 437,125" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#spin)"/>
  <text x="485" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">motor0</text>
  <text x="485" y="143" text-anchor="middle" font-size="13" fill="#0d47a1">CCW</text>
  <text x="561" y="111" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR0_PX 0.15</text>
  <text x="561" y="129" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR0_PY 0.15</text>
  <text x="561" y="147" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR0_KM 0.05</text>
  <circle cx="275" cy="335" r="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <path d="M275,383 A48,48 0 1 0 227,335" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#spin)"/>
  <text x="275" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">motor1</text>
  <text x="275" y="353" text-anchor="middle" font-size="13" fill="#0d47a1">CCW</text>
  <text x="199" y="321" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR1_PX -0.15</text>
  <text x="199" y="339" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR1_PY -0.15</text>
  <text x="199" y="357" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR1_KM 0.05</text>
  <circle cx="275" cy="125" r="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <path d="M275,173 A48,48 0 1 1 323,125" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#spin)"/>
  <text x="275" y="124" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">motor2</text>
  <text x="275" y="143" text-anchor="middle" font-size="13" fill="#0d47a1">CW</text>
  <text x="199" y="111" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR2_PX 0.15</text>
  <text x="199" y="129" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR2_PY -0.15</text>
  <text x="199" y="147" text-anchor="end" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR2_KM -0.05</text>
  <circle cx="485" cy="335" r="60" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <path d="M485,383 A48,48 0 1 1 533,335" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#spin)"/>
  <text x="485" y="334" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">motor3</text>
  <text x="485" y="353" text-anchor="middle" font-size="13" fill="#0d47a1">CW</text>
  <text x="561" y="321" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR3_PX -0.15</text>
  <text x="561" y="339" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR3_PY 0.15</text>
  <text x="561" y="357" text-anchor="start" font-size="12.5" font-family="Menlo, Consolas, monospace" fill="#424242">CA_ROTOR3_KM -0.05</text>
  <text x="380" y="432" text-anchor="middle" font-size="13.5" fill="#1a1a1a">Top view. Positions are in metres from the centre of gravity.</text>
  <text x="380" y="454" text-anchor="middle" font-size="13.5" fill="#1a1a1a">A positive CA_ROTORn_KM is a rotor that turns counter-clockwise (CCW), a negative one clockwise (CW).</text>
</svg>
