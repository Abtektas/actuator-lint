name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  # the release workflow runs these jobs before it makes a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # the PX4 release the engine is built against, see docs/versioning.md
  PX4_REF: v1.17.0

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # tests that need the engine are skipped in this job
      - run: python -m unittest discover -s tests -t .
      - name: Install and run the command
        run: |
          python -m pip install .
          actuator-lint --version

  engine-linux:
    name: Engine, Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: px4io/px4-dev:v1.17.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get PX4
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "$PX4_REF" https://github.com/PX4/PX4-Autopilot.git "$RUNNER_TEMP/px4"
      - name: Build the engine
        run: engine/build.sh "$RUNNER_TEMP/px4"
      - name: Tests with the engine and golden tests
        env:
          ACTUATOR_LINT_ENGINE: build/engine/actuator_lint_engine
        run: ACTUATOR_LINT_PX4_DIR="$RUNNER_TEMP/px4" python3 -m unittest discover -s tests -t .
      # the cross-check does not depend on the processor architecture
      - name: Build PX4 SITL
        if: matrix.arch == 'x86_64'
        run: engine/build_sitl.sh "$RUNNER_TEMP/px4"
      - name: SITL cross-check
        if: matrix.arch == 'x86_64'
        env:
          ACTUATOR_LINT_ENGINE: build/engine/actuator_lint_engine
          ACTUATOR_LINT_SITL_BUILD: build/sitl
        run: python3 -m unittest -v tests.test_sitl
      - name: Package the engine
        run: engine/package.sh build/engine/actuator_lint_engine "$RUNNER_TEMP/px4" "linux-${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actuator_lint_engine-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  engine-macos:
    name: Engine, macOS arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Get PX4 and its build requirements
        run: |
          git clone --depth 1 --branch "$PX4_REF" https://github.com/PX4/PX4-Autopilot.git "$RUNNER_TEMP/px4"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" -r "$RUNNER_TEMP/px4/Tools/setup/requirements.txt"
          command -v ninja || brew install ninja
      - name: Build the engine
        run: ACTUATOR_LINT_PYTHON="$RUNNER_TEMP/venv/bin/python" engine/build.sh "$RUNNER_TEMP/px4"
      - name: Tests with the engine and golden tests
        env:
          ACTUATOR_LINT_ENGINE: build/engine/actuator_lint_engine
        run: ACTUATOR_LINT_PX4_DIR="$RUNNER_TEMP/px4" python -m unittest discover -s tests -t .
      - name: Package the engine
        run: engine/package.sh build/engine/actuator_lint_engine "$RUNNER_TEMP/px4" macos-arm64 dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actuator_lint_engine-macos-arm64
          path: dist/
          if-no-files-found: error
